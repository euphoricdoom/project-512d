[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "project-512d"
version = "0.1.0"
description = "512-dimensional modular dynamical field system — kernel on kernel architecture"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "networkx>=3.1",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
